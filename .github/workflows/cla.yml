# CLA Assistant Lite (contributor-assistant/github-action): comments on each
# outside PR asking the author to sign CLA.md, blocks the check until they
# reply with the sign phrase, and records signatures on the `cla-signatures`
# branch — no external service, no stored credentials beyond GITHUB_TOKEN.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/benjaminjkern/hank/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: benjaminjkern,dependabot[bot]
