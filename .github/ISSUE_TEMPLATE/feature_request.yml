name: Feature request
description: Suggest something Hank should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem
      description: >
        Describe the situation you're in, not the solution you have in mind.
        "I lose track of which roles I already passed on" is more useful than
        "add a filter dropdown".
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd like to happen
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of Hank
      options:
        - The agent's behavior / what it says
        - Right panel and views
        - Job discovery and scraping
        - Application drafting
        - Self-hosting and setup
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered
